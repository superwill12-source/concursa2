name: Gerar APK do Concursa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Conferir arquivos principais
        run: |
          for f in pubspec.yaml lib/main.dart lib/db.dart lib/theme.dart lib/home.dart lib/questions.dart lib/simulado.dart lib/config.dart; do
            if [ ! -f "$f" ]; then
              echo "::error::Arquivo ausente: $f"
              exit 1
            fi
          done

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar base Android (sem alterar o código Dart)
        run: flutter create --platforms android --project-name concursa --org br.com.concursa .

      - name: Definir compileSdk 36 no app e nos plugins
        run: |
          ARQ_APP=android/app/build.gradle.kts
          ARQ_RAIZ=android/build.gradle.kts
          sed -i 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 36/' "$ARQ_APP"
          {
          cat <<'KTS'
          subprojects {
              afterEvaluate {
                  val ext = extensions.findByName("android")
                  if (ext != null) {
                      try {
                          ext.javaClass.getMethod("setCompileSdk", Integer::class.java).invoke(ext, 36)
                      } catch (e: NoSuchMethodException) {
                          ext.javaClass.getMethod("setCompileSdkVersion", Int::class.javaPrimitiveType).invoke(ext, 36)
                      }
                  }
              }
          }

          KTS
          cat "$ARQ_RAIZ"
          } > /tmp/raiz.kts && mv /tmp/raiz.kts "$ARQ_RAIZ"
          grep -n "compileSdk" "$ARQ_APP" || true

      - name: Permitir internet no app
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -c INTERNET android/app/src/main/AndroidManifest.xml

      - name: Instalar dependências
        run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --release

      - name: Renomear APK
        run: cp build/app/outputs/flutter-apk/app-release.apk concursa.apk

      - name: Guardar APK nos artefatos
        uses: actions/upload-artifact@v4
        with:
          name: concursa-apk
          path: concursa.apk
          if-no-files-found: error

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Concursa v${{ github.run_number }}
          files: concursa.apk
